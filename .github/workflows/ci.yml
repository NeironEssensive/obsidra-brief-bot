name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Testcontainers поднимает PostgreSQL и Redis в Docker, который уже есть на раннере
      - name: Build and test
        # chmod: mvnw создан на Windows, и git мог не сохранить флаг исполняемого файла
        run: chmod +x mvnw && ./mvnw -B verify
